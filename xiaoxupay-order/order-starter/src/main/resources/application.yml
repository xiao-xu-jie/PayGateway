server:
  port: 8011
spring:
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  application:
    name: xiaoxupay-order
  cloud:
    nacos:
      config:
        server-addr: nacos_ip:nacos_port
        file-extension: yml   #指定配置文件扩展名为yml
        username: nacos_username
        password: nacos_password
        namespace: pay-gateway
  config:
    import:
      - nacos:${spring.application.name}.yml
      - nacos:db-common.yml    #数据库公共配置
      - nacos:nacos-discovery.yml
      - nacos:snail-${spring.profiles.active}.yml
logging:
  config: classpath:log4j2-spring.xml
  level:
    com.alibaba.cloud.nacos: debug